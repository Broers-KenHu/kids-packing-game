<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>小小打包台</title>
<meta name="description" content="拖箱子、包泡泡纸、戳泡泡的小游戏。离线可玩，不联网，不收集任何数据。">
<meta name="theme-color" content="#7cc6ec">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="打包台">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/*
  小小打包台（儿童版）：拖箱子、包泡泡纸、戳泡泡，给孩子在平板上玩。
  整页一个文件，不连任何服务器、没有外部链接、没有登录、不收集数据；
  只在本机记住「最多打包几个」、收集到的贴纸、大关卡奖章和进度、声音和背景音乐开关。
  全屏画布 + 上面一排大按钮；支持几根手指同时拖箱子。
  打包好的箱子装上右边的小货车，装满 5 个货车开走；箱子上的贴纸收进贴纸本。
  每送走 5 辆货车进一次大关卡，5 关按难易轮着来：大卡车要开啦 → 巨无霸箱子 → 暴风雨来啦 → 捣蛋小狗 → 传送带快跑。
  大关卡不会输，按表现给 1–3 颗星和一枚奖章；贴纸本里点已得到的奖章可以再玩那一关。
*/
:root {
  --ink: #24323a;
  --muted: #56707c;
  --pill: rgba(255, 255, 255, .9);
  --accent: #ff7a00;
  --cell: clamp(48px, min(calc((100vw - 96px) / 4), calc((100vh - 260px) / 5)), 110px);
  color-scheme: light;
}
@supports (height: 100dvh) {
  :root { --cell: clamp(48px, min(calc((100vw - 96px) / 4), calc((100dvh - 260px) / 5)), 110px); }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body {
  margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%;
}
body {
  position: fixed; inset: 0;
  background: linear-gradient(#a6dbf7 0%, #d6efff 55%, #f2faff 100%);
  color: var(--ink);
  font: 16px/1.4 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, sans-serif;
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; }

.hud {
  position: absolute; top: 0; left: 0; right: 0; z-index: 2;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left));
  pointer-events: none;
}
.hud-left { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.score {
  display: flex; align-items: center; gap: 8px; background: var(--pill); border-radius: 999px;
  padding: 6px 18px 6px 12px; box-shadow: 0 3px 10px rgba(30, 80, 110, .16);
  font-variant-numeric: tabular-nums;
}
.score .star { font-size: 28px; line-height: 1; }
.score b { font-size: 30px; line-height: 1.1; font-weight: 800; min-width: 1ch; }
.score small { font-size: 14px; color: var(--muted); margin-left: 4px; white-space: nowrap; }
@media (max-width: 440px) { .score small { display: none; } }
.trip {
  display: flex; align-items: center; gap: 2px; background: var(--pill); border-radius: 999px;
  padding: 3px 12px 3px 10px; box-shadow: 0 3px 10px rgba(30, 80, 110, .12); font-size: 13px; color: var(--muted);
  white-space: nowrap;
}
.trip span { margin-right: 4px; }
.trip i { font-style: normal; font-size: 18px; opacity: .22; filter: grayscale(1); }
.trip i.on { opacity: 1; filter: none; }
.tools { display: flex; gap: 10px; }
.tools button {
  position: relative; pointer-events: auto; width: 58px; height: 58px; border: 0; border-radius: 50%;
  background: var(--pill); box-shadow: 0 3px 10px rgba(30, 80, 110, .16);
  font-size: 28px; line-height: 1; display: grid; place-items: center; padding: 0; color: var(--ink);
  cursor: pointer; transition: transform .12s ease;
}
.tools button:active { transform: scale(.9); }
.tools button svg { width: 28px; height: 28px; }
.tools .dot {
  position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 50%;
  background: #ff3b30; border: 3px solid #fff;
}
.tools button.bounce { animation: bounce .7s ease; }
.tools button.off { opacity: .55; }
.tools button.off::after {
  content: ""; position: absolute; left: 22%; right: 22%; top: 50%; height: 4px; margin-top: -2px;
  background: #e63946; border-radius: 2px; transform: rotate(-40deg);
}
@keyframes bounce { 0% { transform: scale(1); } 30% { transform: scale(1.3) rotate(-8deg); } 60% { transform: scale(.94) rotate(4deg); } 100% { transform: scale(1); } }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.hint {
  position: absolute; z-index: 1; left: 50%; transform: translateX(-50%);
  top: calc(max(12px, env(safe-area-inset-top)) + 72px);
  width: max-content; max-width: calc(100vw - 32px);
  background: var(--pill); border-radius: 18px; padding: 8px 16px; text-align: center;
  font-size: 17px; color: var(--ink); box-shadow: 0 3px 10px rgba(30, 80, 110, .12);
  pointer-events: none; transition: opacity .8s ease;
}
.hint.gone { opacity: 0; }
#safe { position: fixed; left: 0; bottom: 0; width: 1px; height: env(safe-area-inset-bottom, 0px); visibility: hidden; pointer-events: none; }
#safe-top { position: fixed; left: 0; top: 0; width: 1px; height: env(safe-area-inset-top, 0px); visibility: hidden; pointer-events: none; }

/* 贴纸本 */
.book {
  position: fixed; inset: 0; z-index: 5; display: grid; place-items: center;
  background: rgba(20, 60, 90, .38); padding: 16px;
}
.book-card {
  background: #fffdf7; border-radius: 26px; padding: 16px 18px 18px; box-shadow: 0 12px 40px rgba(20, 60, 90, .3);
  display: flex; flex-direction: column; gap: 12px; align-items: center; max-width: 100%;
  max-height: calc(100vh - 32px); overflow-y: auto; touch-action: pan-y;
}
@supports (height: 100dvh) { .book-card { max-height: calc(100dvh - 32px); } }
.book-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; }
.book-head h2 { margin: 0; font-size: 22px; font-weight: 800; }
.book-head h2 span { font-size: 18px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 6px; }
.book-close {
  width: 52px; height: 52px; border-radius: 50%; border: 0; background: #eef3f6; font-size: 24px; cursor: pointer; flex: none;
}
.book-body { display: flex; flex-direction: column; gap: 10px; width: max-content; max-width: 100%; }
.book-grid { display: grid; grid-template-columns: repeat(4, var(--cell)); gap: 10px; }
.cell {
  width: var(--cell); height: var(--cell); border-radius: 18px; border: 3px dashed #c9d6dd; background: #f1f5f7;
  display: grid; place-items: center; font-size: calc(var(--cell) * .55); line-height: 1; color: #b7c4cb; padding: 0;
  font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
}
.cell.got { border: 3px solid var(--c, #ffb703); background: #fff; cursor: pointer; box-shadow: 0 3px 0 var(--c, #ffb703); }
.cell.got.new { animation: shine 1.2s ease 2; }
.cell.wiggle { animation: wiggle .5s ease; }
.cell .q { font: 800 calc(var(--cell) * .38) / 1 system-ui, sans-serif; }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-12deg) scale(1.12); } 60% { transform: rotate(9deg) scale(1.06); } }
@keyframes shine { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
.book-sub { margin: 4px 0 0; font-size: 17px; font-weight: 800; }
.medal-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.medal {
  border-radius: 16px; border: 3px dashed #c9d6dd; background: #f1f5f7; padding: 6px 2px 5px; min-width: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 12px; line-height: 1.2; color: #8fa1a9; min-height: calc(var(--cell) * .95);
}
.medal b {
  font-size: calc(var(--cell) * .36); line-height: 1; font-weight: 400;
  font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
}
.medal.got { border: 3px solid #ffb703; background: #fff; color: var(--ink); cursor: pointer; box-shadow: 0 3px 0 #ffb703; }
.medal.lock b { filter: grayscale(1); opacity: .35; }
.medal .stars { font-size: 11px; letter-spacing: -1px; white-space: nowrap; }
.book-foot { margin: 0; font-size: 16px; color: var(--muted); text-align: center; }
.book-again {
  min-height: 48px; padding: 0 22px; border-radius: 999px; border: 0; background: var(--accent); color: #fff;
  font-size: 18px; font-weight: 700; cursor: pointer;
}

@media (max-width: 560px) {
  .tools { gap: 6px; }
  .tools button { width: 44px; height: 44px; font-size: 21px; }
  .score { padding: 5px 14px 5px 10px; }
  .score b { font-size: 24px; }
  .score .star { font-size: 22px; }
  .trip i { font-size: 15px; }
  .hint { font-size: 15px; top: calc(max(12px, env(safe-area-inset-top)) + 62px); }
  .book-grid { gap: 8px; }
  .medal-grid { gap: 6px; }
}
@media (prefers-reduced-motion: reduce) {
  .tools button, .hint { transition: none; }
  .tools button.bounce, .cell.wiggle, .cell.got.new { animation: none; }
}
</style>
</head>
<body>
<canvas id="game" aria-label="打包台小游戏：拖动、扔、叠箱子，点箱子包泡泡纸，点泡泡捏爆，打包好的箱子装上小货车。"></canvas>

<div class="hud">
  <div class="hud-left">
    <div class="score" aria-live="polite">
      <span class="star" aria-hidden="true">⭐</span>
      <b id="packed">0</b>
      <small id="best-wrap" hidden>最多 <span id="best">0</span></small>
    </div>
    <div class="trip" id="trip"></div>
  </div>
  <div class="tools">
    <button type="button" id="book-btn" aria-label="贴纸本">📒<i class="dot" id="book-dot" hidden></i></button>
    <button type="button" id="sweep" aria-label="换一批箱子">🧹</button>
    <button type="button" id="music" aria-label="背景音乐" aria-pressed="true">🎵</button>
    <button type="button" id="sound" aria-label="声音" aria-pressed="true">🔊</button>
    <button type="button" id="full" aria-label="全屏" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
      </svg>
    </button>
  </div>
</div>
<div class="hint" id="hint">拖一拖、扔一扔 · 点箱子包泡泡纸 · 戳破泡泡就打包好啦！</div>

<div class="book" id="book" role="dialog" aria-modal="true" aria-labelledby="book-title" hidden>
  <div class="book-card">
    <div class="book-head">
      <h2 id="book-title">我的贴纸本<span id="book-count">0/16</span></h2>
      <button type="button" class="book-close" id="book-close" aria-label="关上贴纸本">✕</button>
    </div>
    <div class="book-body">
      <div class="book-grid" id="book-grid"></div>
      <h3 class="book-sub">大关卡奖章</h3>
      <div class="medal-grid" id="medal-grid"></div>
    </div>
    <p class="book-foot" id="book-foot">打包好箱子，就能收集箱子上的贴纸。</p>
    <button type="button" class="book-again" id="book-again" hidden>再集一次</button>
  </div>
</div>
<div id="safe" aria-hidden="true"></div>
<div id="safe-top" aria-hidden="true"></div>

<script>
(function () {
  "use strict";

  var el = function (id) { return document.getElementById(id); };
  var canvas = el("game"), ctx = canvas.getContext("2d");
  var REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  var STANDALONE = !!(window.matchMedia && (window.matchMedia("(display-mode: fullscreen)").matches ||
    window.matchMedia("(display-mode: standalone)").matches)) || window.navigator.standalone === true;

  // ---------------------------------------------------------------- 本机小存储（存不了也照样玩） ----
  function load(key) { try { return window.localStorage.getItem(key); } catch (e) { return null; } }
  function save(key, value) { try { window.localStorage.setItem(key, value); } catch (e) { /* 不影响玩 */ } }

  // ---------------------------------------------------------------- 素材 ----
  // 箱子上贴的是图案贴纸（小朋友不用认字）；一共 16 种，打包好就收进贴纸本。
  var STICKERS = [["🧸", "#ff6b6b"], ["🚗", "#4d96ff"], ["🦖", "#2bb673"], ["🍎", "#e63946"], ["🎈", "#ff8fab"],
    ["⚽", "#444444"], ["🐶", "#c77d3a"], ["🐱", "#f4a261"], ["🦄", "#b980f0"], ["🚀", "#5465ff"],
    ["🍓", "#ef476f"], ["🐟", "#118ab2"], ["🌈", "#ffb703"], ["🎁", "#d62828"], ["🐼", "#555555"], ["🍌", "#e9c46a"]];
  var PAPERS = [
    { body: "#c9a06b", top: "#b88c57", tape: "#e3c28f", edge: "#8f6a3e" },
    { body: "#ffb3c7", top: "#f597b2", tape: "#ffe0ea", edge: "#c76b88" },
    { body: "#9fd3ff", top: "#7fc0f5", tape: "#d8eeff", edge: "#4f8fc4" },
    { body: "#a8e6b5", top: "#87d499", tape: "#dcf5e2", edge: "#4d9d62" },
    { body: "#ffe08a", top: "#f7cd5f", tape: "#fff3c9", edge: "#bf9b2e" },
    { body: "#d3b8ff", top: "#bc98f7", tape: "#ede3ff", edge: "#8c69c9" }
  ];
  var GOLD = { body: "#ffd54a", top: "#f4c430", tape: "#fff1b0", edge: "#c99a14" };
  var BOSS_PAPER = { body: "#c9a06b", top: "#b88c57", tape: "#e3c28f", edge: "#7a5530" };
  var TRUCK_COLORS = ["#ff6b6b", "#4d96ff", "#2bb673", "#ffb703", "#b980f0"];
  var RUSH_COLOR = "#ff8c42";
  var CONFETTI = ["#ff6b6b", "#ffd166", "#06d6a0", "#4d96ff", "#b980f0", "#ff8fab"];
  var POPS = ["啪", "啵", "噗"];
  var SIZES = [[60, 46], [76, 56], [96, 66], [70, 70], [110, 52], [84, 62]];
  var TRUCK_LOAD = 5;
  var EMOJI_FONT = '"Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
  var FONT = getComputedStyle(document.body).fontFamily;

  // ---------------------------------------------------------------- 大关卡（按难易排好的顺序） ----
  var LEVEL_EVERY = 5;   // 每送走 5 辆货车进一次大关卡
  var LEVELS = [null,
    { key: "rush", name: "大卡车要开啦", short: "大卡车", medal: "⏰", goal: "闹钟响之前，装满大卡车 8 箱！" },
    { key: "boss", name: "巨无霸箱子", short: "巨无霸", medal: "👑", goal: "戳破巨无霸身上所有的泡泡！几根手指一起戳更快" },
    { key: "rain", name: "暴风雨来啦", short: "暴风雨", medal: "🌈", goal: "下雨啦！打包 6 箱，快包泡泡纸或者拖到雨棚下" },
    { key: "puppy", name: "捣蛋小狗", short: "小狗", medal: "🐶", goal: "小狗在捣乱！打包 8 箱，点小狗扔球给它玩" },
    { key: "belt", name: "传送带快跑", short: "传送带", medal: "🏁", goal: "箱子在传送带上跑，跑到头之前快打包好！" }
  ];
  var WAVES = [{ speed: 45, goal: 3, every: 3.6 }, { speed: 75, goal: 3, every: 3.0 }, { speed: 105, goal: 4, every: 2.5 }];

  // ---------------------------------------------------------------- 状态 ----
  var W = 0, H = 0, DPR = 1, FLOOR = 0, K = 1, MAX_BOXES = 10, RIGHT = 0, SAFE_TOP = 0;
  var boxes = [], bits = [], floats = [], cheer = null;
  var drags = {};                       // 每根手指一个：pointerId → 正在拖的箱子
  var bossTouch = {};                   // 正在戳巨无霸的手指
  var packed = 0, best = Number(load("kids-pack-best")) || 0, lastSpawn = 0, hintGone = false;
  var soundOn = load("kids-pack-sound") !== "off", musicOn = load("kids-pack-music") !== "off", audio = null;
  var collected = readCollected(), sets = Number(load("kids-pack-sets")) || 0, freshSticker = -1;
  var truck = { w: 0, x0: 0, offset: 0, from: 0, state: "come", t: 0, v: 0, color: 0, items: [], reserved: 0, pending: [], bump: 0,
    cap: TRUCK_LOAD, kind: "normal", after: null };
  var game = { mode: "normal", t: 0, no: 0, replay: false, stars: 0, best: 0, newMedal: false };  // normal | intro | level | outro
  var L = null;                          // 正在玩的大关卡
  var trips = clampInt(load("kids-pack-trips"), 0, LEVEL_EVERY - 1, 0);
  var nextLevel = clampInt(load("kids-pack-next-level"), 1, 5, 1);
  var medals = readMedals();
  var BELT = 0, beltPos = 0, shake = 0, musicBpm = 100, puppy = null, ball = null, rain = [], boxSeq = 0;

  function clamp(v, a, z) { return Math.max(a, Math.min(z, v)); }
  function clampInt(v, a, z, d) { var n = parseInt(v, 10); return isNaN(n) ? d : clamp(n, a, z); }
  function pick(list) { return list[Math.floor(Math.random() * list.length)]; }
  function liveCount() { var n = 0; boxes.forEach(function (b) { if (!b.leaving && !b.gone) n++; }); return n; }

  function readCollected() {
    var list = [];
    try { list = JSON.parse(load("kids-pack-stickers") || "[]"); } catch (e) { list = []; }
    if (!Array.isArray(list)) list = [];
    return list.filter(function (i, n) { return i >= 0 && i < STICKERS.length && Math.floor(i) === i && list.indexOf(i) === n; });
  }
  function readMedals() {
    var raw = {}, out = {};
    try { raw = JSON.parse(load("kids-pack-medals") || "{}") || {}; } catch (e) { raw = {}; }
    for (var n = 1; n <= 5; n++) { var s = parseInt(raw[n], 10); if (s >= 1 && s <= 3) out[n] = s; }
    return out;
  }

  function showScore() {
    el("packed").textContent = packed;
    if (best) { el("best-wrap").hidden = false; el("best").textContent = best; }
    el("book-btn").setAttribute("aria-label", "贴纸本：" + collected.length + "/" + STICKERS.length);
  }
  // 左上角的小货车：再送走几辆就到大关卡。
  function showTrip() {
    var t = el("trip");
    t.hidden = game.mode !== "normal";
    var html = "<span>大关卡</span>";
    for (var i = 0; i < LEVEL_EVERY; i++) html += '<i class="' + (i < trips ? "on" : "") + '">🚚</i>';
    t.innerHTML = html;
    t.setAttribute("aria-label", "再送走 " + (LEVEL_EVERY - trips) + " 辆货车就到大关卡");
  }
  function hideHint() { if (!hintGone) { hintGone = true; el("hint").classList.add("gone"); } }

  function layoutTruck() {
    truck.w = Math.round((truck.cap > TRUCK_LOAD ? 178 : 132) * K);
    truck.x0 = W - truck.w - Math.round(8 * K);
    RIGHT = truck.x0 - Math.round(6 * K);
  }
  function clampBoxes() {
    boxes.forEach(function (b) {
      if (b.leaving || b.carried) return;
      b.x = clamp(b.x, 0, Math.max(0, RIGHT - b.w)); b.y = Math.min(b.y, FLOOR - b.h);
    });
  }
  function setTruck(cfg) { truck.cap = cfg.cap; truck.kind = cfg.kind; layoutTruck(); clampBoxes(); }

  function resize() {
    var rect = canvas.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = rect.width; H = rect.height;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // 平板屏幕大，箱子、泡泡跟着放大，手指好点。已经在台上的箱子保持原来的大小。
    K = clamp(Math.min(W, H) / 520, 0.8, 1.7);
    FLOOR = H - Math.round(44 * K) - (el("safe").offsetHeight || 0);
    SAFE_TOP = el("safe-top").offsetHeight || 0;
    MAX_BOXES = W * H > 500000 ? 12 : 9;
    layoutTruck();      // 右边停小货车，箱子只在货车左边玩。
    clampBoxes();
  }

  function pickSticker() {
    // 一半机会挑还没收集到的贴纸，集齐不会等太久。
    var missing = [];

  // ---------------------------------------------------------------- 小货车 ----
  // 货车停着、还有空位：箱子飞进车斗的某个位置；货车不在（开走了、正开回来）：箱子飞出右边，等下一辆车来了再装上。

  function finishLevel() {
    if (!L || game.mode !== "level") return;
    var stars = levelStars(), prev = medals[L.no] || 0;
    if (stars > prev) { medals[L.no] = stars; save("kids-pack-medals", JSON.stringify(medals)); }
    if (!game.replay) { nextLevel = L.no % 5 + 1; save("kids-pack-next-level", String(nextLevel)); }
    game.mode = "outro"; game.t = 0; game.stars = stars; game.best = Math.max(prev, stars); game.newMedal = !prev;
    L.ended = true; L.goalDone = true;
    BELT = 0; musicBpm = 100; ball = null; bossTouch = {};
    if (puppy && !puppy.inTruck) { puppy.state = "leave"; if (puppy.carry) dropCarry(); }
    if (!prev) el("book-dot").hidden = false;
    sound("cheer");
    for (var i = 0; i < 8; i++) confetti(W * (0.06 + i * 0.125), H * 0.62, 24, 700);
  }

  function endOutro() {
    if (game.mode !== "outro") return;
    game.mode = "normal"; game.t = 0;
    L = null; puppy = null; ball = null; rain = []; BELT = 0; musicBpm = 100;
    boxes = boxes.filter(function (b) { return !b.boss; });
    showTrip();
    if (liveCount() < 3) for (var i = 0; i < 5; i++) spawn(RIGHT * (0.12 + i * 0.19));
    lastSpawn = performance.now();
  }

  function stepGame(dt, live) {
    if (game.mode === "intro") {
      var before = game.t;
      game.t += dt;
      [1.2, 2.2, 3.2].forEach(function (mark) { if (before < mark && game.t >= mark) sound("count"); });
      if (game.t >= 4.2) startLevel();
      return;
    }
    if (game.mode === "outro") {
      game.t += dt;
      if (game.t > 5.5) endOutro();
    }
    if (!L) return;
    L.t += dt;
    if (game.mode === "level") {
      if (L.endIn != null) { L.endIn -= dt; if (L.endIn <= 0) { L.endIn = null; finishLevel(); return; } }
      if (L.key === "rush") stepRush(dt);
      else if (L.key === "boss") stepBoss(dt);
      else if (L.key === "belt") stepBelt(dt);
    }
    if (L && L.key === "rain") stepRain(dt, live);
    if (puppy) stepPuppy(dt);
    if (ball) stepBall(dt);
  }

  // ---- ① 大卡车要开啦：闹钟倒计时，越到最后音乐越快；时间到了司机再等一会儿（不会输）
  function stepRush(dt) {
    if (truck.kind !== "rush" || truck.state !== "parked") return;
    L.time -= dt;
    var sec = Math.ceil(L.time);
    if (L.time < 10 && sec !== L.lastSecond && sec >= 0) sound("tick");
    L.lastSecond = sec;
    if (L.time <= 0) {
      L.time = 20; L.extended++;
      floats.push({ x: RIGHT / 2, y: H * 0.32, life: 2, text: "司机说：再等你一会儿！", strong: true, big: true });
      sound("beep");
    }
    musicBpm = 100 + 36 * clamp(1 - L.time / 60, 0, 1);
  }

  // ---- ② 巨无霸箱子：几十个泡泡，时不时打个嗝又鼓起几个
  function spawnBoss() {
    var w = Math.round(Math.min(RIGHT * 0.6, 460 * K)), h = Math.round(w * 0.62);
    var b = { id: ++boxSeq, x: (RIGHT - w) / 2, y: -h - 40 * K, w: w, h: h, vx: 0, vy: 0, tilt: 0, squash: 0, si: -1,
      emoji: "🎁", sticker: "#d62828", paper: BOSS_PAPER, wrap: null, leaving: 0, done: false, drag: null,
      grounded: false, py: 0, fly: null, flyScale: 1, wet: 0, boss: true, burst: 0 };
    b.wrap = bubbleGrid(b, clamp(w / 20, 10, 28));
    L.boss = b; L.total = b.wrap.length;
    boxes.push(b);
  }
  function bossLeft() { return L.boss ? L.boss.wrap.filter(function (x) { return !x.popped; }).length : 0; }
  function stepBoss(dt) {
    var b = L.boss;
    if (!b) return;
    if (!L.landed && b.grounded) {
      L.landed = true; shake = 0.5; sound("boss");
      floats.push({ x: b.x + b.w / 2, y: b.y - 20 * K, life: 1.2, text: "咚！", strong: true, big: true });
    }
    if (b.done) { b.burst += dt; if (b.burst > 0.45) b.gone = true; return; }
    L.hiccupIn -= dt;
    if (L.hiccupIn <= 0 && L.landed) {
      L.hiccupIn = 6 + Math.random() * 3;
      var left = bossLeft(), popped = b.wrap.filter(function (x) { return x.popped; });
      if (left > 6 && popped.length) {
        for (var i = 0; i < 3 && popped.length; i++) popped.splice(Math.floor(Math.random() * popped.length), 1)[0].popped = false;
        b.squash = 0.18;
        floats.push({ x: b.x + b.w / 2, y: b.y - 14 * K, life: 1.2, text: "嗝～", strong: true, big: true });
        sound("boing");
      }
    }
  }
  function bossDefeated(b) {
    b.done = true; L.goalDone = true; shake = 0.6; bossTouch = {};
    sound("cheer");
    floats.push({ x: b.x + b.w / 2, y: b.y - 10 * K, life: 2, text: "打败巨无霸啦！", strong: true, big: true });
    for (var i = 0; i < 6; i++) confetti(b.x + b.w * (0.1 + i * 0.16), b.y + b.h * 0.5, 30, 700);
    L.endIn = 1.6;
  }

  // ---- ③ 暴风雨来啦：没包泡泡纸、又不在雨棚下的箱子会被淋湿，湿了要擦三下
  function shedWidth() { return Math.round(RIGHT * 0.24); }
  function roofY() { return FLOOR - Math.round(200 * K); }
  function stepRain(dt, live) {
    var raining = game.mode === "level" && !L.goalDone;
    L.dark += ((raining ? 1 : 0) - L.dark) * Math.min(1, dt * (raining ? 1.2 : 0.8));
    L.flash = Math.max(0, L.flash - dt * 3);
    var sw = shedWidth(), ry = roofY();
    if (raining) {
      var n = (REDUCED ? 60 : 260) * (W / 1000) * dt;
      for (var i = 0; i < n; i++) rain.push({ x: Math.random() * W, y: -20, v: (700 + Math.random() * 300) * K });
      L.thunderIn -= dt;
      if (L.thunderIn <= 0) { L.flash = 1; sound("thunder"); L.thunderIn = 9 + Math.random() * 6; }
      live.forEach(function (b) {
        if (b.drag || b.wrap || b.done || b.soaked || b.boss) return;
        var sheltered = b.x + b.w / 2 < sw && b.y + b.h > ry + 10 * K;
        if (sheltered) return;
        b.wet = Math.min(1, (b.wet || 0) + dt / 3);
        if (b.wet >= 1) {
          b.soaked = true; b.dry = 0; L.wetCount++;
          floats.push({ x: b.x + b.w / 2, y: b.y - 8 * K, life: 1.4, text: "湿了！擦一擦" });
          sound("drip");
        }
      });
    }
    rain = rain.filter(function (d) {
      d.y += d.v * dt;
      return d.y < FLOOR && !(d.x < sw && d.y > ry);
    });
  }

  // ---- ④ 捣蛋小狗：跑来跑去撞箱子、叼走小箱子；点它扔个球，它就去追球玩
  var PUP = 56;
  function hitPuppy(p) {
    if (!puppy || puppy.inTruck || puppy.state === "leave" || puppy.jump >= 0) return false;
    var s = PUP * K;
    return Math.abs(p.x - puppy.x) < s * 0.6 && p.y > FLOOR - s * 1.1 && p.y < FLOOR + 6 * K;
  }
  function throwBall() {
    var P = puppy;
    if (!P || P.state === "toTruck" || P.state === "chase") return;
    if (P.carry) dropCarry();
    var dir = P.x < RIGHT / 2 ? 1 : -1;
    ball = { x: P.x + dir * 20 * K, y: FLOOR - 60 * K, vx: dir * (420 + Math.random() * 220) * K, vy: -780 * K, spin: 0, age: 0 };
    P.state = "chase";
    floats.push({ x: P.x, y: FLOOR - PUP * K - 10 * K, life: 1.1, text: "接球！", strong: true });
    sound("bark");
  }
  function takeFromPuppy(b) {
    b.carried = false;
    if (puppy && puppy.carry === b) { puppy.carry = null; puppy.state = "roam"; puppy.wait = 2.5; }
    floats.push({ x: b.x + b.w / 2, y: b.y - 8 * K, life: 1, text: "拿回来啦！" });
  }
  function dropCarry() {
    var b = puppy.carry;
    puppy.carry = null;
    if (b) { b.carried = false; b.vy = 0; b.vx = 0; }
  }
  function validTarget(b) {
    return !b.leaving && !b.done && !b.gone && !b.drag && !b.carried && !b.boss &&
      b.y + b.h >= FLOOR - 2 && b.x + b.w < RIGHT - 4;
  }
  function puppyToTruck() { if (puppy) { if (puppy.carry) dropCarry(); puppy.state = "toTruck"; ball = null; } }
  function moveToward(P, x, speed, dt) {
    var d = x - P.x;
    P.dir = d >= 0 ? 1 : -1;
    var stepLen = speed * K * dt;
    if (Math.abs(d) <= stepLen) { P.x = x; return true; }
    P.x += P.dir * stepLen;
    P.running = true;
    return false;
  }
  function stepPuppy(dt) {
    var P = puppy, s = PUP * K;
    P.t += dt; P.running = false;
    if (P.state === "leave") { moveToward(P, -120 * K, 320, dt); if (P.x < -100 * K) puppy = null; return; }
    if (P.inTruck) return;
    if (P.jump >= 0) {
      P.jump += dt / 0.55;
      var g = truckGeo();
      P.x = P.jx + (g.bedX + g.bedW * 0.5 - P.jx) * Math.min(1, P.jump);
      if (P.jump >= 1) {
        P.jump = -1; P.inTruck = true;
        truck.state = "full"; truck.t = 0;
        floats.push({ x: g.bedX + g.bedW / 2, y: FLOOR - 110 * K, life: 1.6, text: "汪汪！一起出发！", strong: true });
        sound("bark");
      }
      return;
    }
    switch (P.state) {
      case "enter":
        if (moveToward(P, RIGHT * 0.3, 260, dt)) { P.state = "roam"; P.wait = 2; }
        break;
      case "roam":
        P.wait -= dt;
        if (P.wanderX == null || Math.abs(P.wanderX - P.x) < 4) P.wanderX = s + Math.random() * Math.max(10, RIGHT - 2 * s);
        moveToward(P, P.wanderX, 70, dt);
        if (P.wait <= 0) {
          var options = boxes.filter(validTarget);
          if (options.length) { P.target = pick(options); P.state = "toBox"; } else P.wait = 1.5;
        }
        break;
      case "toBox":
        var b = P.target;
        if (!b || !validTarget(b)) { P.state = "roam"; P.wait = 1.5; break; }
        moveToward(P, b.x + b.w / 2, 240, dt);
        if (Math.abs(b.x + b.w / 2 - P.x) < b.w / 2 + s * 0.2) {
          L.mischief++;
          if (b.w <= 100 * K && !b.wrap) {
            b.carried = true; P.carry = b; P.state = "carry";
            floats.push({ x: P.x, y: FLOOR - s - 12 * K, life: 1, text: "汪！叼走啦" });
          } else {
            b.vx = P.dir * 650 * K; b.vy = -380 * K; b.grounded = false;
            floats.push({ x: P.x, y: FLOOR - s - 12 * K, life: 1, text: "汪！" });
            P.state = "roam"; P.wait = 2.5 + Math.random() * 1.5;
          }
          sound("bark");
        }
        break;
      case "carry":
        var c = P.carry;
        if (!c || !c.carried) { P.carry = null; P.state = "roam"; P.wait = 2; break; }
        moveToward(P, s * 0.5, 200, dt);
        c.x = P.x - c.w / 2 - 6 * K; c.y = FLOOR - s * 0.78 - c.h; c.vx = 0; c.vy = 0; c.grounded = false;
        if (P.x <= s * 0.5 + 1) { dropCarry(); floats.push({ x: P.x + 20 * K, y: FLOOR - s - 12 * K, life: 1, text: "汪汪！" }); P.state = "roam"; P.wait = 3; }
        break;
      case "chase":
        if (!ball) { P.state = "roam"; P.wait = 2; break; }
        moveToward(P, ball.x, 330, dt);
        if (ball.age > 0.6 && Math.abs(ball.x - P.x) < s * 0.45 && ball.y > FLOOR - s * 0.6) {   // 球落地附近才叼得到
          ball = null; P.state = "happy"; P.happy = 2.6;
          floats.push({ x: P.x, y: FLOOR - s - 12 * K, life: 1.4, text: "❤️" });
          sound("bark");
        }
        break;
      case "happy":
        P.happy -= dt;
        if (P.happy <= 0) { P.state = "roam"; P.wait = 2.5; }
        break;
      case "toTruck":
        if (truck.state !== "parked") break;
        var g2 = truckGeo();
        if (moveToward(P, g2.bedX - s * 0.2, 280, dt)) { P.jx = P.x; P.jump = 0; P.state = "jump"; }
        break;
    }
  }
  function stepBall(dt) {
    var r = 14 * K;
    ball.age += dt;
    ball.vy += 2100 * K * dt;
    ball.x += ball.vx * dt; ball.y += ball.vy * dt; ball.spin += ball.vx * dt / r;
    if (ball.y > FLOOR - r) { ball.y = FLOOR - r; ball.vy = -ball.vy * 0.55; if (Math.abs(ball.vy) < 90 * K) ball.vy = 0; ball.vx *= 0.85; }
    if (ball.x < r) { ball.x = r; ball.vx = Math.abs(ball.vx) * 0.6; }
    if (ball.x > RIGHT - r) { ball.x = RIGHT - r; ball.vx = -Math.abs(ball.vx) * 0.6; }
  }

  // ---- ⑤ 传送带快跑：三波，一波比一波快；没打包好就跑到头的箱子会被送回左边重来
  function nextWave() {
    L.wave++; L.inWave = 0;
    var w = WAVES[L.wave - 1];
    BELT = w.speed * K; musicBpm = 100 + (L.wave - 1) * 10; L.spawnT = Math.min(L.spawnT, 0.8);
    if (L.wave > 1) {
      floats.push({ x: RIGHT / 2, y: H * 0.32, life: 1.8, text: "第 " + L.wave + " 波！更快啦！", strong: true, big: true });
      sound("level");
    }
  }
  function stepBelt(dt) {
    if (L.goalDone) return;
    L.spawnT -= dt;
    if (L.spawnT <= 0) {
      L.spawnT = WAVES[L.wave - 1].every;
      if (liveCount() < 5) {
        var b = spawn(30 * K + 50 * K);
        if (b && L.wave === WAVES.length && !L.goldenDone) {
          L.goldenDone = true;
          b.golden = true; b.paper = GOLD; b.si = -1; b.emoji = "⭐"; b.sticker = "#f4b400";
        }
      }
    }
  }
  function recycleAtBeltEnd(live) {
    live.forEach(function (b) {
      if (b.drag || b.done || b.boss || !b.grounded || b.x + b.w < RIGHT - 1) return;
      L.recycled++;
      floats.push({ x: RIGHT - 60 * K, y: FLOOR - b.h - 20 * K, life: 1.4, text: "回到起点再来～" });
      sound("thunk");
      b.x = 6 * K; b.y = -b.h - 30 * K; b.vx = 0; b.vy = 0; b.grounded = false; b.py = b.y;
    });
  }

  // ---------------------------------------------------------------- 物理 ----
  // 箱子都是不转的长方形。为了放着不动时不抖：
  // 1. 左右相撞只把两个箱子推开、速度取平均（不反弹）；
  // 2. 上下按「从最低的箱子开始」一个个落位，每个箱子正好坐在地面或下面那个箱子的顶上，落稳就把竖直速度清零；
  // 3. 慢到几乎不动的就停住；画的时候对齐到整像素。倾斜和压扁只是画出来的手感，静止时都是 0。
  function overlapX(a, b) { return Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x); }
  function overlapY(a, b) { return Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y); }
  // a 上一帧在 b 上方（a 的底不低于 b 的顶）：这两个是上下叠的关系，不算左右相撞。
  function wasAbove(a, b) { return a.py + a.h <= b.py + 6 * K; }

  function step(dt) {
    var now = performance.now();
    var rule = spawnRule();
    if (rule && now - lastSpawn > rule.every && liveCount() < Math.min(rule.max, MAX_BOXES)) { spawn(); lastSpawn = now; }
    stepTruck(dt);
    shake = Math.max(0, shake - dt);
    beltPos += BELT * dt;
    var live = boxes.filter(function (b) { return !b.leaving && !b.carried && !b.gone; });
    var gravity = 2100 * K, g = truckGeo();
    live.forEach(function (b) { b.py = b.y; });

    boxes.forEach(function (b) {
      if (b.gone) return;
      if (b.fly) {
        // 打包好的箱子划一道弧线，缩小装进车斗。
        var f = b.fly;
        f.t = Math.min(1, f.t + dt / 0.7);
        var target = f.slot >= 0 ? slotPos(f.slot, g) : { cx: W + 80 * K, by: FLOOR - 40 * K };
        var endScale = f.slot >= 0 ? g.mini / b.w : 0.45;
        var e = f.t * f.t * (3 - 2 * f.t);
        var cx = f.cx0 + (target.cx - f.cx0) * e, by = f.by0 + (target.by - f.by0) * e - Math.sin(Math.PI * f.t) * 120 * K;
        b.flyScale = 1 + (endScale - 1) * e;
        b.x = cx - b.w / 2; b.y = by - b.h; b.tilt *= 0.85; b.squash = 0;
        if (f.t >= 1) arrive(b);
        return;
      }
      if (b.leaving) {
        // 被 🧹 扫走：往左边滑出去。
        b.vx -= 2600 * K * dt; b.vy = Math.min(b.vy, 0) - 300 * K * dt;
        b.x += b.vx * dt; b.y += b.vy * dt; b.tilt = clamp(b.tilt - dt * 2, -0.5, 0.5);
        return;
      }
      if (b.carried) { b.tilt += (0.25 * (puppy ? -puppy.dir : 0) - b.tilt) * 0.2; return; }  // 小狗叼着走
      if (b.drag) {
        var d = b.drag, tx = d.last.x - d.dx, ty = d.last.y - d.dy;
        b.vx = (tx - b.x) / Math.max(dt, 1 / 120); b.vy = (ty - b.y) / Math.max(dt, 1 / 120);
        b.x += (tx - b.x) * 0.6; b.y += (ty - b.y) * 0.6;
        b.tilt += (clamp(d.vx / 3000, -0.35, 0.35) - b.tilt) * 0.2;
      } else {
        b.vy += gravity * dt;
        b.vx *= b.grounded ? Math.pow(0.02, dt) : Math.pow(0.7, dt);
        if (b.grounded && Math.abs(b.vx) < 6) b.vx = 0;
        if (b.grounded && BELT && !b.boss) b.vx = BELT;          // 传送带带着走
        b.x += b.vx * dt; b.y += b.vy * dt;
        var lean = Math.abs(b.vx) > 40 && !BELT ? clamp(b.vx / 4000, -0.2, 0.2) : 0;
        b.tilt += (lean - b.tilt) * 0.2;
        if (Math.abs(b.tilt) < 0.002) b.tilt = 0;
      }
      if (b.x < 0) { b.x = 0; b.vx = Math.abs(b.vx) * 0.3; }
      if (b.drag) {
        // 拿在手里可以拖到货车上面（放下时会退回来）。
        if (b.x + b.w > W) b.x = W - b.w;
      } else if (b.x + b.w > RIGHT) {
        // 货车左边是一堵看不见的墙：越过去的慢慢滑回来，看起来像撞到货车弹回。
        var limit = RIGHT - b.w;
        b.x += (limit - b.x) * 0.35;
        if (b.x - limit < 0.5) b.x = limit;
        b.vx = Math.min(b.vx, 0) - (b.vx > 0 ? b.vx * 0.3 : 0);
      }
      if (b.y < -400 * K) b.y = -400 * K;
      if (b.y + b.h > FLOOR && b.drag) b.y = FLOOR - b.h;
      b.squash *= 0.82;
      if (b.squash < 0.004) b.squash = 0;
    });

    // 左右相撞：推开，不反弹。拿在手里的箱子不动，被它推的那个让开。
    for (var pass = 0; pass < 3; pass++) {
      for (var i = 0; i < live.length; i++) {
        for (var j = i + 1; j < live.length; j++) {
          var a = live[i], c = live[j];
          if (wasAbove(a, c) || wasAbove(c, a)) continue;
          var ox = overlapX(a, c);
          if (ox <= 0 || overlapY(a, c) <= 1) continue;
          if (a.drag && c.drag) continue;
          var dir = a.x + a.w / 2 < c.x + c.w / 2 ? -1 : 1;
          var wa = a.drag ? 0 : c.drag ? 1 : 0.5;
          a.x += dir * ox * wa; c.x -= dir * ox * (1 - wa);
          var avg = (a.vx + c.vx) / 2;
          if (!a.drag) a.vx = avg * 0.6;
          if (!c.drag) c.vx = avg * 0.6;
        }
      }
    }

    // 上下：从最低的箱子开始落位，每个箱子坐在地面或下面已经落好的箱子顶上。
    var order = live.slice().sort(function (p, q) { return (q.y + q.h) - (p.y + p.h); });
    order.forEach(function (b) {
      if (b.drag) { b.grounded = false; return; }
      var support = FLOOR, under = null;
      live.forEach(function (o) {
        if (o === b || overlapX(b, o) <= 1 || !wasAbove(b, o)) return;
        if (o.y < support) { support = o.y; under = o; }
      });
      if (b.y + b.h >= support - 0.5) {
        if (b.vy > 600 * K) { b.squash = Math.min(0.16, b.vy / (9000 * K)); if (b.vy > 900 * K) sound("thud"); }
        b.y = support - b.h;

        var cx = ((i * 0.27 + L.t * 0.02) % 1.3 - 0.15) * W, cy = (70 + (i % 2) * 40) * K + SAFE_TOP, r = (60 + (i % 3) * 18) * K;

  // 大关卡进行中：上方一个小条，写着目标和进度（家长念给孩子听，孩子看进度条）。
  function drawLevelPill() {
    if (game.mode !== "level" || !L) return;
    var text, prog = 0, urgent = false;
    if (L.key === "rush") { text = "⏰ " + Math.max(0, Math.ceil(L.time)) + " 秒   📦 " + truck.items.length + "/8"; prog = truck.items.length / 8; urgent = L.time < 10; }
    else if (L.key === "boss") { var left = bossLeft(); text = "👑 巨无霸还剩 " + left + " 个泡泡"; prog = L.total ? 1 - left / L.total : 0; }
    else if (L.key === "rain") { text = "🌧️ 打包 " + L.count + "/" + L.goal + (L.wetCount ? "    💧 " + L.wetCount : ""); prog = L.count / L.goal; }
    else if (L.key === "puppy") { text = "🐶 打包 " + L.count + "/" + L.goal; prog = L.count / L.goal; }
    else { text = "🏁 第 " + L.wave + " 波    打包 " + L.count + "/" + L.goal; prog = L.count / L.goal; }
    ctx.font = "800 " + Math.round(18 * Math.max(1, K * 0.85)) + "px " + FONT;
    var tw = ctx.measureText(text).width, pw = tw + 44, ph = 44 * Math.max(1, K * 0.85), px = W / 2 - pw / 2, py = SAFE_TOP + 80;
    var pulse = urgent ? 0.5 + 0.5 * Math.sin(performance.now() / 120) : 0;
    ctx.fillStyle = urgent ? "rgba(255," + Math.round(235 - 60 * pulse) + "," + Math.round(235 - 60 * pulse) + ",.95)" : "rgba(255,255,255,.92)";
    roundRect(px, py, pw, ph, ph / 2); ctx.fill();
    ctx.fillStyle = urgent ? "#c92a2a" : "#24323a"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(text, W / 2, py + ph * 0.42);
    ctx.fillStyle = "rgba(0,0,0,.08)"; roundRect(px + 18, py + ph - 9, pw - 36, 5, 2.5); ctx.fill();
    ctx.fillStyle = urgent ? "#e63946" : "#1f9d55"; roundRect(px + 18, py + ph - 9, Math.max(5, (pw - 36) * clamp(prog, 0, 1)), 5, 2.5); ctx.fill();
  }

  function drawCard(scale) {
    var cw = Math.min(W - 32, 560), ch = Math.min(H - 40, 380);
    ctx.save();
    ctx.translate(W / 2, H / 2); ctx.scale(scale, scale);
    ctx.fillStyle = "#fffdf7"; roundRect(-cw / 2, -ch / 2, cw, ch, 26); ctx.fill();
    return { w: cw, h: ch };
  }
  function drawIntro() {
    var def = LEVELS[game.no], t = game.t;
    ctx.fillStyle = "rgba(20,45,70,.45)"; ctx.fillRect(0, 0, W, H);
    var card = drawCard(REDUCED ? 1 : Math.min(1, 0.6 + t * 3)), ch = card.h;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#ff7a00"; ctx.font = "800 20px " + FONT; ctx.fillText("大关卡 " + game.no + " / 5", 0, -ch * 0.38);
    ctx.font = "64px " + EMOJI_FONT; ctx.fillText(def.medal, 0, -ch * 0.18);
    ctx.fillStyle = "#24323a"; ctx.font = "800 32px " + FONT; ctx.fillText(def.name, 0, ch * 0.02);
    ctx.fillStyle = "#56707c"; ctx.font = "600 17px " + FONT; ctx.fillText(def.goal, 0, ch * 0.14, card.w - 40);
    var n = t < 1.2 ? "" : t < 2.2 ? "3" : t < 3.2 ? "2" : "1";
    if (n) {
      var f = (t - 1.2) % 1;
      ctx.fillStyle = "#ff7a00"; ctx.font = "900 " + Math.round(58 + 20 * (1 - f)) + "px " + FONT; ctx.fillText(n, 0, ch * 0.34);
    } else {
      ctx.fillStyle = "#8fa1a9"; ctx.font = "600 15px " + FONT; ctx.fillText("准备好了吗？", 0, ch * 0.34);
    }
    ctx.restore();
  }
  function drawOutro() {
    var def = LEVELS[game.no], t = game.t;
    ctx.fillStyle = "rgba(20,45,70,.4)"; ctx.fillRect(0, 0, W, H);
    var card = drawCard(REDUCED ? 1 : Math.min(1, 0.6 + t * 3)), ch = card.h;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#ff7a00"; ctx.font = "900 34px " + FONT; ctx.fillText("通关啦！🎉", 0, -ch * 0.34);
    ctx.font = "64px " + EMOJI_FONT; ctx.fillText(def.medal, 0, -ch * 0.12);
    for (var i = 0; i < 3; i++) {
      var on = i < game.stars, pop = REDUCED ? 1 : clamp((t - 0.4 - i * 0.35) * 4, 0, 1);
      ctx.save(); ctx.translate((i - 1) * 54, ch * 0.08); ctx.scale(pop, pop);
      if (on) { ctx.font = "44px " + EMOJI_FONT; ctx.fillText("⭐", 0, 0); }
      else { ctx.fillStyle = "#c9d6dd"; ctx.font = "800 44px " + FONT; ctx.fillText("☆", 0, 0); }
      ctx.restore();
    }
    ctx.fillStyle = "#56707c"; ctx.font = "600 17px " + FONT;
    ctx.fillText(game.newMedal ? "得到「" + def.name + "」奖章！在 📒 里能看到" : "最好成绩 " + starText(game.best), 0, ch * 0.26, card.w - 40);
    if (t > 2) { ctx.fillStyle = "#8fa1a9"; ctx.font = "600 15px " + FONT; ctx.fillText("点一下继续", 0, ch * 0.38); }
    ctx.restore();
  }

  function drawCheer() {
    var t = 1 - cheer.life / cheer.total, s = REDUCED ? 1 : Math.min(1, 0.55 + t * 5);
    ctx.save();
    ctx.globalAlpha = Math.min(1, cheer.life * 2);
    ctx.translate(W / 2, H * 0.36); ctx.scale(s, s);
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
    ctx.font = "800 " + Math.round(48 * K) + "px " + FONT;
    ctx.lineWidth = 10 * K; ctx.strokeStyle = "#fff"; ctx.strokeText(cheer.text, 0, 0);
    ctx.fillStyle = "#ff7a00"; ctx.fillText(cheer.text, 0, 0);
    ctx.font = "700 " + Math.round(22 * K) + "px " + FONT;
    ctx.lineWidth = 6 * K; ctx.strokeText(cheer.sub, 0, 44 * K);
    ctx.fillStyle = "#24323a"; ctx.fillText(cheer.sub, 0, 44 * K);
    ctx.restore();
  }

  // ---------------------------------------------------------------- 声音（浏览器自己合成，不加载文件） ----
  function unlockAudio() {
    if (!soundOn) return;
    if (!audio) {
      try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; return; }
      audio.onstatechange = function () { if (audio.state === "running") startMusic(); };
    }
    if (audio.state === "suspended" && audio.resume) audio.resume();
    startMusic();
  }
  function tone(type, from, to, length, volume, delay) {
    var t = audio.currentTime + (delay || 0), osc = audio.createOscillator(), gain = audio.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(from, t);
    osc.frequency.exponentialRampToValueAtTime(to, t + length);
    gain.gain.setValueAtTime(volume, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + length);
    osc.connect(gain); gain.connect(audio.destination);
    osc.start(t); osc.stop(t + length + 0.02);
  }
  function getNoise() {
    if (!music.noise) {
      var length = Math.floor(audio.sampleRate * 0.2), buffer = audio.createBuffer(1, length, audio.sampleRate), data = buffer.getChannelData(0);
      for (var i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
      music.noise = buffer;
    }
    return music.noise;
  }
  function noise(filterType, freq, length, volume) {
    var t = audio.currentTime, src = audio.createBufferSource(), filter = audio.createBiquadFilter(), gain = audio.createGain();
    src.buffer = getNoise(); src.loop = true;
    filter.type = filterType; filter.frequency.value = freq;
    gain.gain.setValueAtTime(volume, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + length);
    src.connect(filter); filter.connect(gain); gain.connect(audio.destination);
    src.start(t); src.stop(t + length + 0.05);
  }
  function sound(kind) {
    if (!soundOn || !audio || audio.state !== "running") return;
    // 戳破泡泡：很短的一声「啪」，从高往低掉，每次音高稍微不一样。
    if (kind === "pop") tone("triangle", 700 + Math.random() * 400, 220, 0.06, 0.18);
    else if (kind === "wrap") tone("sine", 300, 500, 0.12, 0.08);
    else if (kind === "done") tone("sine", 520, 1040, 0.22, 0.12);
    else if (kind === "thud") tone("sine", 120, 60, 0.12, 0.2);
    else if (kind === "thunk") tone("sine", 200, 110, 0.1, 0.12);
    else if (kind === "sweep") tone("sawtooth", 500, 120, 0.25, 0.04);
    else if (kind === "sparkle") { tone("triangle", 1319, 1319, 0.12, 0.08); tone("triangle", 1760, 1760, 0.2, 0.08, 0.1); }
    else if (kind === "beep") tone("square", 440, 440, 0.12, 0.05);
    else if (kind === "honk") { tone("square", 392, 392, 0.14, 0.06); tone("square", 392, 392, 0.22, 0.06, 0.2); }
    else if (kind === "cheer") { tone("triangle", 523, 523, 0.16, 0.14); tone("triangle", 659, 659, 0.16, 0.14, 0.14); tone("triangle", 784, 1046, 0.34, 0.14, 0.28); }
    else if (kind === "level") { tone("triangle", 523, 523, 0.12, 0.12); tone("triangle", 784, 784, 0.24, 0.12, 0.12); }
    else if (kind === "count") tone("sine", 660, 660, 0.18, 0.12);
    else if (kind === "go") tone("triangle", 784, 1568, 0.3, 0.14);
    else if (kind === "tick") tone("square", 1500, 1500, 0.03, 0.025);
    else if (kind === "boing") tone("sine", 180, 420, 0.25, 0.14);
    else if (kind === "boss") tone("sine", 110, 40, 0.45, 0.32);
    else if (kind === "bark") { tone("square", 560, 380, 0.07, 0.05); tone("square", 600, 400, 0.08, 0.05, 0.11); }
    else if (kind === "drip") tone("sine", 1100, 500, 0.09, 0.07);
    else if (kind === "wipe") noise("highpass", 3000, 0.1, 0.05);
    else if (kind === "thunder") noise("lowpass", 260, 1.2, 0.12);
  }

  // ---------------------------------------------------------------- 背景音乐 ----
  // 一首自己写的轻快小曲（C 大调，平时每分钟 100 拍，16 小节一圈约 38 秒）：
  // 低音「咚」在每小节第 1、3 拍，和弦「嚓」在反拍，八音盒一样的旋律，再加一点很轻的沙锤。
  // 全部由浏览器现场合成，不加载文件；音量比戳泡泡这些音效小很多，只当背景。大关卡里会快一点或慢一点。
  var CHORDS = {
    C: { bass: 48, tones: [60, 64, 67] }, Am: { bass: 45, tones: [60, 64, 69] }, F: { bass: 41, tones: [60, 65, 69] },
    G: { bass: 43, tones: [59, 62, 67] }, Em: { bass: 40, tones: [59, 64, 67] }, Dm: { bass: 38, tones: [62, 65, 69] }
  };
  // 每小节：前半拍和弦、后半拍和弦、8 个八分音符的旋律（0 = 不弹）。
  var SONG = [
    ["C", "C", [76, 0, 79, 0, 84, 0, 79, 76]], ["Am", "Am", [76, 0, 72, 0, 69, 72, 76, 0]],
    ["F", "F", [77, 0, 81, 0, 84, 0, 81, 77]], ["G", "G", [79, 0, 0, 74, 79, 0, 83, 0]],
    ["C", "C", [76, 0, 79, 0, 84, 0, 88, 0]], ["Am", "Am", [86, 84, 81, 0, 76, 0, 72, 0]],
    ["F", "G", [77, 81, 84, 0, 83, 79, 74, 0]], ["C", "C", [72, 0, 76, 79, 72, 0, 0, 0]],
    ["F", "F", [81, 0, 81, 84, 81, 0, 77, 0]], ["G", "G", [79, 0, 79, 83, 79, 0, 74, 0]],
    ["Em", "Em", [76, 0, 79, 0, 83, 0, 79, 0]], ["Am", "Am", [81, 0, 76, 0, 72, 0, 76, 0]],
    ["F", "F", [77, 81, 84, 81, 77, 0, 72, 0]], ["G", "G", [79, 83, 86, 83, 79, 0, 74, 0]],
    ["Em", "Am", [76, 0, 79, 0, 81, 0, 76, 0]], ["Dm", "G", [74, 0, 77, 0, 79, 0, 83, 0]]
  ];
  var music = { timer: null, step: 0, next: 0, gain: null, noise: null };

  function mtof(midi) { return 440 * Math.pow(2, (midi - 69) / 12); }
  function musicNote(type, midi, t, length, volume) {
    var osc = audio.createOscillator(), gain = audio.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(mtof(midi), t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(volume, t + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + length);
    osc.connect(gain); gain.connect(music.gain);
    osc.start(t); osc.stop(t + length + 0.02);
  }
  function shaker(t, volume) {
    var src = audio.createBufferSource(), filter = audio.createBiquadFilter(), gain = audio.createGain();
    src.buffer = getNoise();
    filter.type = "highpass"; filter.frequency.value = 6000;
    gain.gain.setValueAtTime(volume, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    src.connect(filter); filter.connect(gain); gain.connect(music.gain);
    src.start(t); src.stop(t + 0.06);
  }
  function playStep(i, t) {
    var bar = SONG[Math.floor(i / 8) % SONG.length], s = i % 8, chord = CHORDS[s < 4 ? bar[0] : bar[1]], lead = bar[2][s];
    if (s === 0 || s === 4) musicNote("triangle", chord.bass, t, 0.4, 0.07);               // 咚
    if (s === 2 || s === 6) chord.tones.forEach(function (n) { musicNote("triangle", n, t, 0.16, 0.016); }); // 嚓
    if (lead) { musicNote("sine", lead, t, 0.5, 0.06); musicNote("triangle", lead + 12, t, 0.18, 0.012); }  // 八音盒
    shaker(t, s % 2 ? 0.022 : 0.01);
  }
  function scheduleMusic() {
    if (!audio || audio.state !== "running") return;
    var now = audio.currentTime;
    if (music.next < now - 0.05) music.next = now + 0.03;   // 后台停过一会儿：从现在接着弹，不补弹
    while (music.next < now + 0.15) {
      playStep(music.step, music.next);
      music.step = (music.step + 1) % (SONG.length * 8);
      music.next += 60 / musicBpm / 2;
    }
  }
  function startMusic() {
    if (!soundOn || !musicOn || !audio || audio.state !== "running" || music.timer || document.hidden) return;
    if (!music.gain) { music.gain = audio.createGain(); music.gain.connect(audio.destination); }
    var t = audio.currentTime;
    music.gain.gain.cancelScheduledValues(t);
    music.gain.gain.setValueAtTime(0.0001, t);
    music.gain.gain.exponentialRampToValueAtTime(1, t + 1.5);   // 慢慢响起来
    music.next = t + 0.05;
    music.timer = setInterval(scheduleMusic, 25);
    scheduleMusic();
  }
  function stopMusic() {
    if (!music.timer) return;
    clearInterval(music.timer);
    music.timer = null;
    if (audio && music.gain) {
      var t = audio.currentTime;
      music.gain.gain.cancelScheduledValues(t);
      music.gain.gain.setValueAtTime(Math.max(music.gain.gain.value, 0.0001), t);
      music.gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    }
  }
  // 切到后台、锁屏：音乐和声音都停；回来再接着放。
  function pauseAll() { stopMusic(); if (audio && audio.state === "running" && audio.suspend) audio.suspend(); }
  function resumeAll() { if (audio && soundOn && audio.state === "suspended" && audio.resume) audio.resume(); startMusic(); }
  window.kidsPackPause = pauseAll;     // 安卓安装包在应用切到后台时调用
  window.kidsPackResume = resumeAll;
  document.addEventListener("visibilitychange", function () { if (document.hidden) pauseAll(); else resumeAll(); });

  // ---------------------------------------------------------------- 按钮 ----
  function showSound() {
    var b = el("sound");
    b.textContent = soundOn ? "🔊" : "🔇";
    b.setAttribute("aria-pressed", String(soundOn));
    b.setAttribute("aria-label", soundOn ? "声音：开" : "声音：关");
  }
  el("sound").addEventListener("click", function () {
    soundOn = !soundOn;
    save("kids-pack-sound", soundOn ? "on" : "off");
    showSound();
    if (!soundOn) stopMusic();
    unlockAudio();
    if (soundOn) setTimeout(function () { sound("sparkle"); }, 30);
  });
  function showMusic() {
    var b = el("music");
    b.classList.toggle("off", !musicOn);
    b.setAttribute("aria-pressed", String(musicOn));
    b.setAttribute("aria-label", musicOn ? "背景音乐：开" : "背景音乐：关");
  }
  // 🎵 只管背景音乐；戳泡泡这些音效由 🔊 管。打开音乐时如果声音是关的，一起打开。
  el("music").addEventListener("click", function () {
    musicOn = !musicOn;
    save("kids-pack-music", musicOn ? "on" : "off");
    showMusic();
    if (!musicOn) { stopMusic(); return; }
    if (!soundOn) { soundOn = true; save("kids-pack-sound", "on"); showSound(); }
    unlockAudio();
  });
  el("sweep").addEventListener("click", function () { unlockAudio(); if (game.mode === "normal" || game.mode === "level") sweep(); });

  // 全屏按钮：从主屏幕图标打开时本来就是全屏，不显示；浏览器里能全屏才显示。
  var root = document.documentElement;
  var canFull = !STANDALONE && !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  if (canFull) {
    el("full").hidden = false;
    el("full").addEventListener("click", function () {
      var inFull = document.fullscreenElement || document.webkitFullscreenElement;
      try {
        if (inFull) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        else (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
      } catch (e) { /* 不支持就算了 */ }
    });
  }

  // ---------------------------------------------------------------- 别让页面被缩放、滚动、长按弹菜单 ----
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (type) {
    document.addEventListener(type, function (event) { event.preventDefault(); }, { passive: false });
  });
  document.addEventListener("touchmove", function (event) {
    if (event.target && event.target.closest && event.target.closest(".book-card")) return;  // 贴纸本在小屏上可以上下滑
    event.preventDefault();
  }, { passive: false });
  document.addEventListener("dblclick", function (event) { event.preventDefault(); }, { passive: false });
  document.addEventListener("contextmenu", function (event) { event.preventDefault(); });
  document.addEventListener("touchend", unlockAudio, { passive: true }); // iPad 上声音要在手指抬起时解锁

  // 只读的状态快照，给自动测试看（不能改游戏）。
  window.kidsPackState = function () {
    return {
      mode: game.mode, levelNo: game.no, level: L ? L.key : null, packed: packed, trips: trips, nextLevel: nextLevel,
      medals: JSON.parse(JSON.stringify(medals)), bookOpen: !el("book").hidden, right: RIGHT, floor: FLOOR,
      truck: { state: truck.state, cap: truck.cap, kind: truck.kind, items: truck.items.length, x0: truck.x0 + truck.offset, w: truck.w },
      L: L ? { t: L.t, count: L.count, goal: L.goal, time: L.time, extended: L.extended, wave: L.wave, recycled: L.recycled,
        mischief: L.mischief, wetCount: L.wetCount, total: L.total, left: L.key === "boss" ? bossLeft() : null, goalDone: L.goalDone } : null,
      stars: game.stars, belt: BELT,
      puppy: puppy ? { x: puppy.x, state: puppy.state, inTruck: !!puppy.inTruck, carrying: !!puppy.carry } : null,
      ball: !!ball,
      boxes: boxes.filter(function (b) { return !b.gone; }).map(function (b) {
        return { id: b.id, x: b.x, y: b.y, w: b.w, h: b.h, done: b.done, leaving: !!b.leaving, grounded: !!b.grounded, boss: !!b.boss,
          wrapLeft: b.wrap ? b.wrap.filter(function (x) { return !x.popped; }).length : -1, soaked: !!b.soaked,
          carried: !!b.carried, golden: !!b.golden, held: !!b.drag };
      })
    };
  };

  // ---------------------------------------------------------------- 开始 ----
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.033, Math.max(0, (now - last) / 1000));
    last = now;
    if (el("book").hidden) step(dt);     // 打开贴纸本时游戏先停一下
    draw();
    requestAnimationFrame(frame);
  }

  showScore();
  showSound();
  showMusic();
  resize();
  showTrip();
  truck.from = truck.w + 60 * K; truck.offset = truck.from;   // 一开始货车从右边开进来
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 200); });
  for (var i = 0; i < 5; i++) spawn(RIGHT * (0.12 + i * 0.19));
  lastSpawn = performance.now();
  requestAnimationFrame(frame);

  // 想直接玩某一关（家长试玩用）：网址后面加 ?level=1 到 ?level=5。
  var askLevel = parseInt(new URLSearchParams(location.search).get("level"), 10);
  if (askLevel >= 1 && askLevel <= 5) setTimeout(function () { startIntro(askLevel, true); }, 300);

  // 离线可用：装到主屏幕以后，没网也能打开。（直接双击打开本地文件时不需要。）
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () { /* 没有也能玩 */ }); });
  }
})();
</script>
</body>
