<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>小小打包台</title>
<meta name="description" content="拖箱子、包泡泡纸、戳泡泡的小游戏。离线可玩，不联网，不收集任何数据。">
<meta name="theme-color" content="#7cc6ec">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="打包台">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/*
  小小打包台（儿童版）：拖箱子、包泡泡纸、戳泡泡，给孩子在平板上玩。
  整页一个文件，不连任何服务器、没有外部链接、没有登录、不收集数据；
  只在本机记住「最多打包几个」、收集到的贴纸和声音开关。
  全屏画布 + 上面一排大按钮；支持几根手指同时拖箱子。
  打包好的箱子装上右边的小货车，装满 5 个货车开走；箱子上的贴纸收进贴纸本。
*/
:root {
  --ink: #24323a;
  --muted: #56707c;
  --pill: rgba(255, 255, 255, .9);
  --accent: #ff7a00;
  --cell: min(118px, calc((100vw - 96px) / 4), calc((100vh - 200px) / 4));
  color-scheme: light;
}
@supports (height: 100dvh) {
  :root { --cell: min(118px, calc((100vw - 96px) / 4), calc((100dvh - 200px) / 4)); }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body {
  margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%;
}
body {
  position: fixed; inset: 0;
  background: linear-gradient(#a6dbf7 0%, #d6efff 55%, #f2faff 100%);
  color: var(--ink);
  font: 16px/1.4 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, sans-serif;
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; }

.hud {
  position: absolute; top: 0; left: 0; right: 0; z-index: 2;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left));
  pointer-events: none;
}
.score {
  display: flex; align-items: center; gap: 8px; background: var(--pill); border-radius: 999px;
  padding: 6px 18px 6px 12px; box-shadow: 0 3px 10px rgba(30, 80, 110, .16);
  font-variant-numeric: tabular-nums;
}
.score .star { font-size: 28px; line-height: 1; }
.score b { font-size: 30px; line-height: 1.1; font-weight: 800; min-width: 1ch; }
.score small { font-size: 14px; color: var(--muted); margin-left: 4px; }
.tools { display: flex; gap: 10px; }
.tools button {
  position: relative; pointer-events: auto; width: 58px; height: 58px; border: 0; border-radius: 50%;
  background: var(--pill); box-shadow: 0 3px 10px rgba(30, 80, 110, .16);
  font-size: 28px; line-height: 1; display: grid; place-items: center; padding: 0; color: var(--ink);
  cursor: pointer; transition: transform .12s ease;
}
.tools button:active { transform: scale(.9); }
.tools button svg { width: 28px; height: 28px; }
.tools .dot {
  position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 50%;
  background: #ff3b30; border: 3px solid #fff;
}
.tools button.bounce { animation: bounce .7s ease; }
@keyframes bounce { 0% { transform: scale(1); } 30% { transform: scale(1.3) rotate(-8deg); } 60% { transform: scale(.94) rotate(4deg); } 100% { transform: scale(1); } }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.hint {
  position: absolute; z-index: 1; left: 50%; transform: translateX(-50%);
  top: calc(max(12px, env(safe-area-inset-top)) + 72px);
  width: max-content; max-width: calc(100vw - 32px);
  background: var(--pill); border-radius: 18px; padding: 8px 16px; text-align: center;
  font-size: 17px; color: var(--ink); box-shadow: 0 3px 10px rgba(30, 80, 110, .12);
  pointer-events: none; transition: opacity .8s ease;
}
.hint.gone { opacity: 0; }
#safe { position: fixed; left: 0; bottom: 0; width: 1px; height: env(safe-area-inset-bottom, 0px); visibility: hidden; pointer-events: none; }

/* 贴纸本 */
.book {
  position: fixed; inset: 0; z-index: 5; display: grid; place-items: center;
  background: rgba(20, 60, 90, .38); padding: 16px;
}
.book-card {
  background: #fffdf7; border-radius: 26px; padding: 16px 18px 18px; box-shadow: 0 12px 40px rgba(20, 60, 90, .3);
  display: flex; flex-direction: column; gap: 12px; align-items: center; max-width: 100%;
}
.book-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; }
.book-head h2 { margin: 0; font-size: 22px; font-weight: 800; }
.book-head h2 span { font-size: 18px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 6px; }
.book-close {
  width: 52px; height: 52px; border-radius: 50%; border: 0; background: #eef3f6; font-size: 24px; cursor: pointer; flex: none;
}
.book-grid { display: grid; grid-template-columns: repeat(4, var(--cell)); gap: 10px; }
.cell {
  width: var(--cell); height: var(--cell); border-radius: 18px; border: 3px dashed #c9d6dd; background: #f1f5f7;
  display: grid; place-items: center; font-size: calc(var(--cell) * .55); line-height: 1; color: #b7c4cb; padding: 0;
  font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
}
.cell.got { border: 3px solid var(--c, #ffb703); background: #fff; cursor: pointer; box-shadow: 0 3px 0 var(--c, #ffb703); }
.cell.got.new { animation: shine 1.2s ease 2; }
.cell.wiggle { animation: wiggle .5s ease; }
.cell .q { font: 800 calc(var(--cell) * .38) / 1 system-ui, sans-serif; }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-12deg) scale(1.12); } 60% { transform: rotate(9deg) scale(1.06); } }
@keyframes shine { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
.book-foot { margin: 0; font-size: 16px; color: var(--muted); text-align: center; }
.book-again {
  min-height: 48px; padding: 0 22px; border-radius: 999px; border: 0; background: var(--accent); color: #fff;
  font-size: 18px; font-weight: 700; cursor: pointer;
}

@media (max-width: 560px) {
  .tools { gap: 8px; }
  .tools button { width: 48px; height: 48px; font-size: 23px; }
  .score { padding: 5px 14px 5px 10px; }
  .score b { font-size: 24px; }
  .score .star { font-size: 22px; }
  .hint { font-size: 15px; top: calc(max(12px, env(safe-area-inset-top)) + 62px); }
  .book-grid { gap: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  .tools button, .hint { transition: none; }
  .tools button.bounce, .cell.wiggle, .cell.got.new { animation: none; }
}
</style>
</head>
<body>
<canvas id="game" aria-label="打包台小游戏：拖动、扔、叠箱子，点箱子包泡泡纸，点泡泡捏爆，打包好的箱子装上小货车。"></canvas>

<div class="hud">
  <div class="score" aria-live="polite">
    <span class="star" aria-hidden="true">⭐</span>
    <b id="packed">0</b>
    <small id="best-wrap" hidden>最多 <span id="best">0</span></small>
  </div>
  <div class="tools">
    <button type="button" id="book-btn" aria-label="贴纸本">📒<i class="dot" id="book-dot" hidden></i></button>
    <button type="button" id="sweep" aria-label="换一批箱子">🧹</button>
    <button type="button" id="sound" aria-label="声音" aria-pressed="true">🔊</button>
    <button type="button" id="full" aria-label="全屏" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
      </svg>
    </button>
  </div>
</div>
<div class="hint" id="hint">拖一拖、扔一扔 · 点箱子包泡泡纸 · 戳破泡泡就打包好啦！</div>

<div class="book" id="book" role="dialog" aria-modal="true" aria-labelledby="book-title" hidden>
  <div class="book-card">
    <div class="book-head">
      <h2 id="book-title">我的贴纸本<span id="book-count">0/16</span></h2>
      <button type="button" class="book-close" id="book-close" aria-label="关上贴纸本">✕</button>
    </div>
    <div class="book-grid" id="book-grid"></div>
    <p class="book-foot" id="book-foot">打包好箱子，就能收集箱子上的贴纸。</p>
    <button type="button" class="book-again" id="book-again" hidden>再集一次</button>
  </div>
</div>
<div id="safe" aria-hidden="true"></div>

<script>
(function () {
  "use strict";

  var el = function (id) { return document.getElementById(id); };
  var canvas = el("game"), ctx = canvas.getContext("2d");
  var REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  var STANDALONE = !!(window.matchMedia && (window.matchMedia("(display-mode: fullscreen)").matches ||
    window.matchMedia("(display-mode: standalone)").matches)) || window.navigator.standalone === true;

  // ---------------------------------------------------------------- 本机小存储（存不了也照样玩） ----
  function load(key) { try { return window.localStorage.getItem(key); } catch (e) { return null; } }
  function save(key, value) { try { window.localStorage.setItem(key, value); } catch (e) { /* 不影响玩 */ } }

  // ---------------------------------------------------------------- 素材 ----
  // 箱子上贴的是图案贴纸（小朋友不用认字）；一共 16 种，打包好就收进贴纸本。
  var STICKERS = [["🧸", "#ff6b6b"], ["🚗", "#4d96ff"], ["🦖", "#2bb673"], ["🍎", "#e63946"], ["🎈", "#ff8fab"],
    ["⚽", "#444444"], ["🐶", "#c77d3a"], ["🐱", "#f4a261"], ["🦄", "#b980f0"], ["🚀", "#5465ff"],
    ["🍓", "#ef476f"], ["🐟", "#118ab2"], ["🌈", "#ffb703"], ["🎁", "#d62828"], ["🐼", "#555555"], ["🍌", "#e9c46a"]];
  var PAPERS = [
    { body: "#c9a06b", top: "#b88c57", tape: "#e3c28f", edge: "#8f6a3e" },
    { body: "#ffb3c7", top: "#f597b2", tape: "#ffe0ea", edge: "#c76b88" },
    { body: "#9fd3ff", top: "#7fc0f5", tape: "#d8eeff", edge: "#4f8fc4" },
    { body: "#a8e6b5", top: "#87d499", tape: "#dcf5e2", edge: "#4d9d62" },
    { body: "#ffe08a", top: "#f7cd5f", tape: "#fff3c9", edge: "#bf9b2e" },
    { body: "#d3b8ff", top: "#bc98f7", tape: "#ede3ff", edge: "#8c69c9" }
  ];
  var TRUCK_COLORS = ["#ff6b6b", "#4d96ff", "#2bb673", "#ffb703", "#b980f0"];
  var CONFETTI = ["#ff6b6b", "#ffd166", "#06d6a0", "#4d96ff", "#b980f0", "#ff8fab"];
  var POPS = ["啪", "啵", "噗"];
  var SIZES = [[60, 46], [76, 56], [96, 66], [70, 70], [110, 52], [84, 62]];
  var TRUCK_LOAD = 5;
  var EMOJI_FONT = '"Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
  var FONT = getComputedStyle(document.body).fontFamily;

  // ---------------------------------------------------------------- 状态 ----
  var W = 0, H = 0, DPR = 1, FLOOR = 0, K = 1, MAX_BOXES = 10, RIGHT = 0;
  var boxes = [], bits = [], floats = [], cheer = null;
  var drags = {};                       // 每根手指一个：pointerId → 正在拖的箱子
  var packed = 0, best = Number(load("kids-pack-best")) || 0, lastSpawn = 0, hintGone = false;
  var soundOn = load("kids-pack-sound") !== "off", audio = null;
  var collected = readCollected(), sets = Number(load("kids-pack-sets")) || 0, freshSticker = -1;
  var truck = { w: 0, x0: 0, offset: 0, from: 0, state: "come", t: 0, v: 0, color: 0, items: [], reserved: 0, pending: [], bump: 0 };

  function clamp(v, a, z) { return Math.max(a, Math.min(z, v)); }
  function pick(list) { return list[Math.floor(Math.random() * list.length)]; }
  function liveCount() { var n = 0; boxes.forEach(function (b) { if (!b.leaving) n++; }); return n; }

  function readCollected() {
    var list = [];
    try { list = JSON.parse(load("kids-pack-stickers") || "[]"); } catch (e) { list = []; }
    if (!Array.isArray(list)) list = [];
    return list.filter(function (i, n) { return i >= 0 && i < STICKERS.length && Math.floor(i) === i && list.indexOf(i) === n; });
  }

  function showScore() {
    el("packed").textContent = packed;
    if (best) { el("best-wrap").hidden = false; el("best").textContent = best; }
    el("book-btn").setAttribute("aria-label", "贴纸本：" + collected.length + "/" + STICKERS.length);
  }

  function resize() {
    var rect = canvas.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = rect.width; H = rect.height;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // 平板屏幕大，箱子、泡泡跟着放大，手指好点。已经在台上的箱子保持原来的大小。
    K = clamp(Math.min(W, H) / 520, 0.8, 1.7);
    FLOOR = H - Math.round(44 * K) - (el("safe").offsetHeight || 0);
    MAX_BOXES = W * H > 500000 ? 12 : 9;
    // 右边停小货车，箱子只在货车左边玩。
    truck.w = Math.round(132 * K);
    truck.x0 = W - truck.w - Math.round(8 * K);
    RIGHT = truck.x0 - Math.round(6 * K);
    boxes.forEach(function (b) {
      if (b.leaving) return;
      b.x = clamp(b.x, 0, Math.max(0, RIGHT - b.w)); b.y = Math.min(b.y, FLOOR - b.h);
    });
  }

  function pickSticker() {
    // 一半机会挑还没收集到的贴纸，集齐不会等太久。
    var missing = [];
    for (var i = 0; i < STICKERS.length; i++) if (collected.indexOf(i) === -1) missing.push(i);
    if (missing.length && Math.random() < 0.5) return pick(missing);
    return Math.floor(Math.random() * STICKERS.length);
  }

  function spawn(centerX) {
    if (liveCount() >= MAX_BOXES) return;
    var s = pick(SIZES), w = Math.round(s[0] * K), h = Math.round(s[1] * K), si = pickSticker();
    var room = Math.max(0, RIGHT - w);
    var x = centerX != null ? clamp(centerX - w / 2, 0, room) : clamp(20 + Math.random() * (room - 40), 0, room);
    boxes.push({ x: x, y: -h - Math.random() * 60 * K, w: w, h: h, vx: (Math.random() - 0.5) * 120 * K, vy: 0,
      tilt: 0, squash: 0, si: si, emoji: STICKERS[si][0], sticker: STICKERS[si][1],
      paper: Math.random() < 0.4 ? PAPERS[0] : pick(PAPERS.slice(1)),
      wrap: null, leaving: 0, done: false, drag: null, grounded: false, py: 0, fly: null, flyScale: 1 });
  }

  function bubbleGrid(b) {
    // 泡泡大一点、少一点：一个箱子大约 6–12 个。
    var r = Math.max(6, Math.min(9 * K, b.w / 8)), gap = r * 2.25, list = [];
    for (var y = r + 3; y < b.h - r; y += gap) {
      var offset = (Math.round(y / gap) % 2) * r;
      for (var x = r + 3 + offset; x < b.w - r; x += gap) list.push({ x: x, y: y, r: r, popped: false });
    }
    if (!list.length) list.push({ x: b.w / 2, y: b.h / 2, r: r, popped: false });
    return list;
  }

  function hit(px, py) {
    var pad = 6 * K; // 手指比鼠标粗，箱子周围留一点余量
    for (var i = boxes.length - 1; i >= 0; i--) {
      var b = boxes[i];
      if (!b.leaving && !b.done && px >= b.x - pad && px <= b.x + b.w + pad && py >= b.y - pad && py <= b.y + b.h + pad) return b;
    }
    return null;
  }

  function point(event) {
    var rect = canvas.getBoundingClientRect();
    return { x: event.clientX - rect.left, y: event.clientY - rect.top, t: performance.now() };
  }

  // ---------------------------------------------------------------- 手指 / 鼠标 ----
  canvas.addEventListener("pointerdown", function (event) {
    event.preventDefault();
    unlockAudio();
    var p = point(event), b = hit(p.x, p.y);
    if (!b) {
      if (p.x >= RIGHT && p.y > FLOOR - 70 * K) { if (truck.state === "parked") { truck.bump = 1; sound("beep"); } } // 点货车：嘀
      else spawn(p.x);                // 点空的地方：掉下来一箱
      return;
    }
    if (b.drag) return;               // 这个箱子已经被另一根手指拿着
    try { canvas.setPointerCapture(event.pointerId); } catch (e) { /* 老浏览器 */ }
    boxes.splice(boxes.indexOf(b), 1); boxes.push(b);   // 拿起来的放最上层
    var d = { box: b, dx: p.x - b.x, dy: p.y - b.y, start: p, last: p, vx: 0, vy: 0, moved: false };
    drags[event.pointerId] = d; b.drag = d;
  }, { passive: false });

  canvas.addEventListener("pointermove", function (event) {
    var d = drags[event.pointerId];
    if (!d) return;
    var p = point(event), dt = Math.max(1, p.t - d.last.t) / 1000;
    d.vx = d.vx * 0.4 + ((p.x - d.last.x) / dt) * 0.6;
    d.vy = d.vy * 0.4 + ((p.y - d.last.y) / dt) * 0.6;
    if (Math.abs(p.x - d.start.x) + Math.abs(p.y - d.start.y) > 10 * K) d.moved = true;
    d.last = p;
  });

  function release(event, cancelled) {
    var d = drags[event.pointerId];
    if (!d) return;
    delete drags[event.pointerId];
    var b = d.box, p = point(event);
    b.drag = null;
    if (b.leaving) return;
    if (!cancelled && !d.moved && p.t - d.start.t < 450) { tap(b, p); return; }
    b.vx = clamp(d.vx, -1800 * K, 1800 * K); b.vy = clamp(d.vy, -1800 * K, 1200 * K);
    // 没打包好的箱子放到货车上：提示一下，箱子退回台面。
    if (b.x + b.w / 2 > RIGHT) {
      b.vx = -420 * K; b.vy = Math.min(b.vy, -200 * K);
      floats.push({ x: truck.x0 + truck.w / 2 - 30 * K, y: FLOOR - 110 * K, life: 1.6, text: "先戳完泡泡哦" });
    }
  }
  canvas.addEventListener("pointerup", function (event) { release(event, false); });
  canvas.addEventListener("pointercancel", function (event) { release(event, true); });

  function tap(b, p) {
    if (!b.wrap) {
      b.wrap = bubbleGrid(b);
      b.squash = 0.12;
      sound("wrap");
      return;
    }
    var lx = p.x - b.x, ly = p.y - b.y, target = null, bestD = Infinity;
    b.wrap.forEach(function (bubble) {
      if (bubble.popped) return;
      var d = (bubble.x - lx) * (bubble.x - lx) + (bubble.y - ly) * (bubble.y - ly);
      if (d < bestD) { bestD = d; target = bubble; }
    });
    if (!target) return;
    target.popped = true;
    pop(b.x + target.x, b.y + target.y, target.r);
    if (b.wrap.every(function (bubble) { return bubble.popped; })) finish(b);
  }

  function pop(x, y, r) {
    sound("pop");
    floats.push({ x: x, y: y - r, life: 0.7, text: pick(POPS) });
    if (REDUCED) return;
    for (var i = 0; i < 8; i++) {
      var a = Math.random() * Math.PI * 2, v = (80 + Math.random() * 140) * K;
      bits.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60 * K, life: 0.45 + Math.random() * 0.2,
        color: "rgba(170,215,238,.95)", s: 2.6 * K, square: false });
    }
  }

  function confetti(x, y, count, power) {
    if (REDUCED) return;
    for (var i = 0; i < count; i++) {
      var a = -Math.PI / 2 + (Math.random() - 0.5) * 2.2, v = (power * 0.5 + Math.random() * power) * K;
      bits.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.9 + Math.random() * 0.7,
        color: pick(CONFETTI), s: (3 + Math.random() * 3) * K, square: true });
    }
  }

  function finish(b) {
    b.done = true;
    sound("done");
    floats.push({ x: b.x + b.w / 2, y: b.y - 8 * K, life: 1.2, text: "打包好了！", strong: true });
    confetti(b.x + b.w / 2, b.y, 26, 380);
    setTimeout(function () { flyToTruck(b); }, REDUCED ? 120 : 650);
  }

  // ---------------------------------------------------------------- 小货车 ----

    var lh = Math.min(b.h * 0.42, 28 * K), lw = lh * 1.2, lx = 6 * K, ly = b.h - lh - 6 * K;
    ctx.fillStyle = "#fffdf8"; roundRect(lx, ly, lw, lh, 3 * K); ctx.fill();
    ctx.strokeStyle = b.sticker; ctx.lineWidth = 2 * K; roundRect(lx, ly, lw, lh, 3 * K); ctx.stroke();
    ctx.font = Math.round(lh * 0.72) + "px " + EMOJI_FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#000"; ctx.fillText(b.emoji, lx + lw / 2, ly + lh / 2 + lh * 0.04);
    drawFace(b);
    // 泡泡纸
    if (b.wrap) {
      ctx.fillStyle = "rgba(205,232,244,.5)"; roundRect(0, 0, b.w, b.h, r); ctx.fill();
      b.wrap.forEach(function (bubble) {
        ctx.beginPath(); ctx.arc(bubble.x, bubble.y, bubble.r, 0, Math.PI * 2);
        if (bubble.popped) {
          ctx.strokeStyle = "rgba(120,160,180,.45)"; ctx.lineWidth = 1; ctx.stroke();
        } else {
          ctx.fillStyle = "rgba(255,255,255,.72)"; ctx.fill();
          ctx.strokeStyle = "rgba(110,160,185,.85)"; ctx.lineWidth = 1.2; ctx.stroke();
          ctx.fillStyle = "rgba(255,255,255,.95)";
          ctx.beginPath(); ctx.arc(bubble.x - bubble.r * 0.35, bubble.y - bubble.r * 0.35, bubble.r * 0.28, 0, Math.PI * 2); ctx.fill();
        }
      });
    }
    if (b.done) {
      ctx.strokeStyle = "#1f9d55"; ctx.lineWidth = 3 * K; roundRect(3 * K, 3 * K, b.w - 6 * K, b.h - 6 * K, r); ctx.stroke();
      var cr = 11 * K, cx = b.w - 4 * K, cy = 4 * K;
      ctx.fillStyle = "#1f9d55"; ctx.beginPath(); ctx.arc(cx, cy, cr, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.6 * K; ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.beginPath(); ctx.moveTo(cx - cr * 0.45, cy); ctx.lineTo(cx - cr * 0.1, cy + cr * 0.38); ctx.lineTo(cx + cr * 0.5, cy - cr * 0.35); ctx.stroke();
    }
    ctx.restore();
  }

  // 箱子上的小脸：平时笑，被拿起来「哦」，打包好了眯眼笑。
  function drawFace(b) {
    var fx = b.w * 0.68, fy = b.h * 0.5, e = Math.max(5, 7 * K), er = Math.max(1.8, 2.4 * K);
    ctx.fillStyle = "rgba(255,120,140,.35)";
    ctx.beginPath(); ctx.arc(fx - e - 4 * K, fy + 5 * K, 3.2 * K, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(fx + e + 4 * K, fy + 5 * K, 3.2 * K, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = ctx.strokeStyle = "#3a2a1a"; ctx.lineWidth = Math.max(1.5, 1.8 * K); ctx.lineCap = "round";
    [-1, 1].forEach(function (s) {
      ctx.beginPath();
      if (b.done) { ctx.arc(fx + s * e, fy + er, er * 1.5, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke(); }
      else { ctx.arc(fx + s * e, fy, er, 0, Math.PI * 2); ctx.fill(); }
    });
    ctx.beginPath();
    if (b.drag) { ctx.arc(fx, fy + 6 * K, 2.6 * K, 0, Math.PI * 2); ctx.stroke(); }
    else { var m = b.done ? 5 * K : 3.6 * K; ctx.arc(fx, fy + 2.5 * K, m, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke(); }
  }

  function drawCheer() {
    var t = 1 - cheer.life / cheer.total, s = REDUCED ? 1 : Math.min(1, 0.55 + t * 5);
    ctx.save();
    ctx.globalAlpha = Math.min(1, cheer.life * 2);
    ctx.translate(W / 2, H * 0.36); ctx.scale(s, s);
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
    ctx.font = "800 " + Math.round(48 * K) + "px " + FONT;
    ctx.lineWidth = 10 * K; ctx.strokeStyle = "#fff"; ctx.strokeText(cheer.text, 0, 0);
    ctx.fillStyle = "#ff7a00"; ctx.fillText(cheer.text, 0, 0);
    ctx.font = "700 " + Math.round(22 * K) + "px " + FONT;
    ctx.lineWidth = 6 * K; ctx.strokeText(cheer.sub, 0, 44 * K);
    ctx.fillStyle = "#24323a"; ctx.fillText(cheer.sub, 0, 44 * K);
    ctx.restore();
  }

  // ---------------------------------------------------------------- 声音（浏览器自己合成，不加载文件） ----
  function unlockAudio() {
    if (!soundOn) return;
    if (!audio) {
      try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; return; }
    }
    if (audio.state === "suspended" && audio.resume) audio.resume();
  }
  function tone(type, from, to, length, volume, delay) {
    var t = audio.currentTime + (delay || 0), osc = audio.createOscillator(), gain = audio.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(from, t);
    osc.frequency.exponentialRampToValueAtTime(to, t + length);
    gain.gain.setValueAtTime(volume, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + length);
    osc.connect(gain); gain.connect(audio.destination);
    osc.start(t); osc.stop(t + length + 0.02);
  }
  function sound(kind) {
    if (!soundOn || !audio || audio.state !== "running") return;
    // 戳破泡泡：很短的一声「啪」，从高往低掉，每次音高稍微不一样。
    if (kind === "pop") tone("triangle", 700 + Math.random() * 400, 220, 0.06, 0.18);
    else if (kind === "wrap") tone("sine", 300, 500, 0.12, 0.08);
    else if (kind === "done") tone("sine", 520, 1040, 0.22, 0.12);
    else if (kind === "thud") tone("sine", 120, 60, 0.12, 0.2);
    else if (kind === "thunk") tone("sine", 200, 110, 0.1, 0.12);
    else if (kind === "sweep") tone("sawtooth", 500, 120, 0.25, 0.04);
    else if (kind === "sparkle") { tone("triangle", 1319, 1319, 0.12, 0.08); tone("triangle", 1760, 1760, 0.2, 0.08, 0.1); }
    else if (kind === "beep") tone("square", 440, 440, 0.12, 0.05);
    else if (kind === "honk") { tone("square", 392, 392, 0.14, 0.06); tone("square", 392, 392, 0.22, 0.06, 0.2); }
    else if (kind === "cheer") { tone("triangle", 523, 523, 0.16, 0.14); tone("triangle", 659, 659, 0.16, 0.14, 0.14); tone("triangle", 784, 1046, 0.34, 0.14, 0.28); }
  }

  // ---------------------------------------------------------------- 按钮 ----
  function showSound() {
    var b = el("sound");
    b.textContent = soundOn ? "🔊" : "🔇";
    b.setAttribute("aria-pressed", String(soundOn));
    b.setAttribute("aria-label", soundOn ? "声音：开" : "声音：关");
  }
  el("sound").addEventListener("click", function () {
    soundOn = !soundOn;
    save("kids-pack-sound", soundOn ? "on" : "off");
    showSound();
    unlockAudio();
    if (soundOn) setTimeout(function () { sound("sparkle"); }, 30);
  });
  el("sweep").addEventListener("click", function () { unlockAudio(); sweep(); });

  // 全屏按钮：从主屏幕图标打开时本来就是全屏，不显示；浏览器里能全屏才显示。
  var root = document.documentElement;
  var canFull = !STANDALONE && !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  if (canFull) {
    el("full").hidden = false;
    el("full").addEventListener("click", function () {
      var inFull = document.fullscreenElement || document.webkitFullscreenElement;
      try {
        if (inFull) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        else (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
      } catch (e) { /* 不支持就算了 */ }
    });
  }

  // ---------------------------------------------------------------- 别让页面被缩放、滚动、长按弹菜单 ----
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (type) {
    document.addEventListener(type, function (event) { event.preventDefault(); }, { passive: false });
  });
  document.addEventListener("touchmove", function (event) { event.preventDefault(); }, { passive: false });
  document.addEventListener("dblclick", function (event) { event.preventDefault(); }, { passive: false });
  document.addEventListener("contextmenu", function (event) { event.preventDefault(); });
  document.addEventListener("touchend", unlockAudio, { passive: true }); // iPad 上声音要在手指抬起时解锁

  // ---------------------------------------------------------------- 开始 ----
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.033, Math.max(0, (now - last) / 1000));
    last = now;
    step(dt);
    draw();
    requestAnimationFrame(frame);
  }

  showScore();
  showSound();
  resize();
  truck.from = truck.w + 60 * K; truck.offset = truck.from;   // 一开始货车从右边开进来
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 200); });
  for (var i = 0; i < 5; i++) spawn(RIGHT * (0.12 + i * 0.19));
  lastSpawn = performance.now();
  requestAnimationFrame(frame);

  // 离线可用：装到主屏幕以后，没网也能打开。（直接双击打开本地文件时不需要。）
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () { /* 没有也能玩 */ }); });
  }
})();
</script>
</body>
